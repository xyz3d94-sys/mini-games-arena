<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="35%" stop-color="#0369a1"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="radar-sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="badge-bs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="hull-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="45%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow-drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="500" height="500" rx="90" fill="url(#bg-sea)"/>

  <!-- Radar Concentric Circles -->
  <circle cx="250" cy="270" r="190" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.3"/>
  <circle cx="250" cy="270" r="130" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
  <circle cx="250" cy="270" r="70" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <line x1="250" y1="80" x2="250" y2="460" stroke="#38bdf8" stroke-width="2" opacity="0.35"/>
  <line x1="60" y1="270" x2="440" y2="270" stroke="#38bdf8" stroke-width="2" opacity="0.35"/>

  <!-- 5x5 Crosshair Target Dots -->
  <circle cx="170" cy="190" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="330" cy="190" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="170" cy="350" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="330" cy="350" r="4" fill="#38bdf8" opacity="0.6"/>

  <!-- Radar Sweep wedge -->
  <path d="M250,270 L390,140 A190,190 0 0,0 250,80 Z" fill="url(#radar-sweep)"/>

  <!-- Battleship Graphic (Modern Corvette / Destroyer) -->
  <g filter="url(#glow-drop)">
    <!-- Water wake -->
    <path d="M50,375 Q250,395 450,375 Q250,365 50,375 Z" fill="#38bdf8" opacity="0.5"/>

    <!-- Main Hull -->
    <path d="M70,350 L110,320 L370,320 L430,345 L400,370 L100,370 Z" fill="url(#hull-metal)"/>
    <path d="M100,360 L400,360 L380,370 L100,370 Z" fill="#1e293b"/>

    <!-- Deck Red waterline stripe -->
    <line x1="85" y1="352" x2="420" y2="352" stroke="#ef4444" stroke-width="4"/>

    <!-- Superstructure / Cabin -->
    <path d="M160,320 L180,260 L280,260 L320,320 Z" fill="#94a3b8"/>
    <path d="M210,260 L220,230 L270,230 L280,260 Z" fill="#cbd5e1"/>

    <!-- Bridge Windows -->
    <rect x="225" y="240" width="35" height="10" rx="2" fill="#0284c7"/>

    <!-- Gun Turret & Barrel -->
    <circle cx="350" cy="315" r="16" fill="#475569"/>
    <line x1="350" y1="315" x2="420" y2="305" stroke="#334155" stroke-width="7" stroke-linecap="round"/>

    <!-- Radar Mast -->
    <line x1="245" y1="230" x2="245" y2="185" stroke="#f1f5f9" stroke-width="4"/>
    <ellipse cx="245" cy="185" rx="16" ry="6" fill="#38bdf8"/>

    <!-- Target Hit Explosion Burst at enemy coords -->
    <g transform="translate(370, 200)">
      <circle cx="0" cy="0" r="22" fill="#fbbf24" opacity="0.9"/>
      <circle cx="0" cy="0" r="14" fill="#ef4444"/>
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#fef08a" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="-30" x2="0" y2="30" stroke="#fef08a" stroke-width="4" stroke-linecap="round"/>
      <line x1="-20" y1="-20" x2="20" y2="20" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
      <line x1="20" y1="-20" x2="-20" y2="20" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Top 5x5 Radar Pill Badge -->
  <g filter="url(#glow-drop)">
    <rect x="130" y="28" width="240" height="66" rx="33" fill="url(#badge-bs)"/>
    <text x="250" y="72" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="32" fill="#ffffff" letter-spacing="2">5 × 5 RADAR</text>
  </g>
</svg>
