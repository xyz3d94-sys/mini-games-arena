<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Rounded card mask -->
    <clipPath id="card-mask">
      <rect width="500" height="500" rx="90" ry="90"/>
    </clipPath>
    <!-- Drop shadow -->
    <filter id="piece-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Group clipped to rounded card -->
  <g clip-path="url(#card-mask)">
    <!-- 8x8 Chess.com Green & Cream Board Pattern (exactly like user image) -->
    <!-- Cream background -->
    <rect width="500" height="500" fill="#ebecd0"/>

    <!-- Green checkered squares (each 62.5 x 62.5) -->
    <g fill="#739552">
      <!-- Row 0 -->
      <rect x="62.5" y="0" width="62.5" height="62.5"/>
      <rect x="187.5" y="0" width="62.5" height="62.5"/>
      <rect x="312.5" y="0" width="62.5" height="62.5"/>
      <rect x="437.5" y="0" width="62.5" height="62.5"/>
      <!-- Row 1 -->
      <rect x="0" y="62.5" width="62.5" height="62.5"/>
      <rect x="125" y="62.5" width="62.5" height="62.5"/>
      <rect x="250" y="62.5" width="62.5" height="62.5"/>
      <rect x="375" y="62.5" width="62.5" height="62.5"/>
      <!-- Row 2 -->
      <rect x="62.5" y="125" width="62.5" height="62.5"/>
      <rect x="187.5" y="125" width="62.5" height="62.5"/>
      <rect x="312.5" y="125" width="62.5" height="62.5"/>
      <rect x="437.5" y="125" width="62.5" height="62.5"/>
      <!-- Row 3 -->
      <rect x="0" y="187.5" width="62.5" height="62.5"/>
      <rect x="125" y="187.5" width="62.5" height="62.5"/>
      <rect x="250" y="187.5" width="62.5" height="62.5"/>
      <rect x="375" y="187.5" width="62.5" height="62.5"/>
      <!-- Row 4 -->
      <rect x="62.5" y="250" width="62.5" height="62.5"/>
      <rect x="187.5" y="250" width="62.5" height="62.5"/>
      <rect x="312.5" y="250" width="62.5" height="62.5"/>
      <rect x="437.5" y="250" width="62.5" height="62.5"/>
      <!-- Row 5 -->
      <rect x="0" y="312.5" width="62.5" height="62.5"/>
      <rect x="125" y="312.5" width="62.5" height="62.5"/>
      <rect x="250" y="312.5" width="62.5" height="62.5"/>
      <rect x="375" y="312.5" width="62.5" height="62.5"/>
      <!-- Row 6 -->
      <rect x="62.5" y="375" width="62.5" height="62.5"/>
      <rect x="187.5" y="375" width="62.5" height="62.5"/>
      <rect x="312.5" y="375" width="62.5" height="62.5"/>
      <rect x="437.5" y="375" width="62.5" height="62.5"/>
      <!-- Row 7 -->
      <rect x="0" y="437.5" width="62.5" height="62.5"/>
      <rect x="125" y="437.5" width="62.5" height="62.5"/>
      <rect x="250" y="437.5" width="62.5" height="62.5"/>
      <rect x="375" y="437.5" width="62.5" height="62.5"/>
    </g>

    <!-- Subtle radial vignette around edges for depth -->
    <radialGradient id="board-vignette" cx="50%" cy="50%" r="65%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.32"/>
    </radialGradient>
    <rect width="500" height="500" fill="url(#board-vignette)"/>

    <!-- Hero Chess Pieces from image.png (White Knight + Black King) -->
    <!-- Black King in background right -->
    <g transform="translate(245, 125) scale(5.4)" filter="url(#piece-shadow)">
      <g fill="none" fill-rule="evenodd" stroke="#1f1f1f" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6">
        <path stroke-linejoin="miter" d="M22.5 11.6V6"/>
        <path stroke-linejoin="miter" d="M20 8h5"/>
        <path fill="#2c2a29" stroke-linecap="butt" stroke-linejoin="miter" d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5"/>
        <path fill="#2c2a29" d="M11.5 37a22.3 22.3 0 0 0 21 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4V27v-3.5c-3.5-7.5-13-10.5-16-4-3 6 5 10 5 10z"/>
        <path stroke="#ececec" d="M32 29.5s8.5-4 6-9.7C34.1 14 25 18 22.5 24.6v2.1-2.1C20 18 9.9 14 7 19.9c-2.5 5.6 4.8 9 4.8 9"/>
        <path stroke="#ececec" d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"/>
      </g>
    </g>

    <!-- White Knight in foreground left (exact piece from image.png) -->
    <g transform="translate(45, 115) scale(6.4)" filter="url(#piece-shadow)">
      <g fill="none" fill-rule="evenodd" stroke="#22201e" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6">
        <path fill="#ffffff" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
        <path fill="#ffffff" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
        <path fill="#22201e" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.433-9.75a.5 1.5 30 1 1-.866-.5.5 1.5 30 1 1 .866.5"/>
      </g>
    </g>
  </g>
</svg>
