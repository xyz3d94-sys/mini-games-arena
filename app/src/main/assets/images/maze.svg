<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="maze-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Clean Warm Background -->
  <rect width="500" height="500" rx="40" fill="url(#maze-bg)"/>

  <!-- Maze Body (Art from 4.jpg with blue outline and bold orange walls) -->
  <g filter="url(#shadow)">
    <!-- Outer boundary with entrance top-left and exit bottom-right -->
    <!-- Top border -->
    <path d="M70,45 L450,45 L450,420 L425,420 L425,455 L65,455 L65,80 L25,80 L25,95 L50,95 L50,440 L410,440 L410,410 L440,410 L440,60 L85,60 L85,45 Z" fill="#f97316" stroke="#1e3a8a" stroke-width="4" stroke-linejoin="round"/>

    <!-- Internal Maze Corridors and Walls (matching 4.jpg structure) -->
    <!-- Entrance track -->
    <path d="M25,80 L80,80 L80,225 L115,225 L115,120 L180,120 L180,155 L145,155 L145,190 L185,190 L185,160 L240,160 L240,120 L350,120 L350,60 L335,60 L335,105 L255,105 L255,80 L290,80 L290,60" fill="none" stroke="#ea580c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Deep Blue Outline Accents -->
    <!-- Central maze structures -->
    <path d="M120,250 L80,250 L80,380 L140,380 L140,420 L210,420 L210,380 L170,380 L170,340 L120,340 L120,285 L145,285 L145,310 L200,310 L200,270 L160,270 L160,240 L280,240 L280,280 L240,280 L240,340 L360,340 L360,390 L250,390 L250,420 L380,420 L380,310 L315,310 L315,215 L415,215 L415,150 L370,150 L370,180 L345,180 L345,150 L300,150 L300,180 L220,180 L220,215 L170,215" fill="none" stroke="#f97316" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Upper-right branches -->
    <path d="M380,60 L380,105 L420,105 L420,195 L390,195 L390,260 L420,260 L420,410 L470,410" fill="none" stroke="#ea580c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Blue shadow styling from 4.jpg -->
    <path d="M85,55 L445,55 L445,415 L415,415 L415,445 L60,445" fill="none" stroke="#1e3a8a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  </g>

  <!-- Start flag / icon -->
  <circle cx="35" cy="88" r="16" fill="#22c55e" stroke="#15803d" stroke-width="3"/>
  <text x="35" y="93" font-family="sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">S</text>

  <!-- Exit finish flag -->
  <circle cx="455" cy="410" r="16" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>
  <text x="455" y="415" font-family="sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">F</text>
</svg>
