<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Juicy Colorful Tropical) -->
    <linearGradient id="fm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Chalkboard Card -->
    <linearGradient id="board-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Watermelon Rind & Pulp -->
    <linearGradient id="wm-pulp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Apple Green -->
    <linearGradient id="apple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Orange Grad -->
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <filter id="fm-shad" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="44" fill="url(#fm-bg)"/>

  <!-- Blackboard Container -->
  <g filter="url(#fm-shad)">
    <rect x="35" y="35" width="430" height="430" rx="30" fill="url(#board-bg)" stroke="#10b981" stroke-width="4"/>
    <!-- Inner Wooden Frame Accent -->
    <rect x="45" y="45" width="410" height="410" rx="22" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  </g>

  <!-- Line 1: 🍉 + 🍉 = 40 -->
  <g transform="translate(60, 60)" filter="url(#fm-shad)">
    <!-- Watermelon 1 -->
    <g transform="translate(0, 5)">
      <path d="M 0 35 A 35 35 0 0 0 70 35 Z" fill="#166534" stroke="#14532d" stroke-width="3"/>
      <path d="M 4 33 A 31 31 0 0 0 66 33 Z" fill="#bbf7d0"/>
      <path d="M 8 31 A 27 27 0 0 0 62 31 Z" fill="url(#wm-pulp)"/>
      <circle cx="25" cy="20" r="2.5" fill="#1e1b4b"/>
      <circle cx="35" cy="25" r="2.5" fill="#1e1b4b"/>
      <circle cx="45" cy="20" r="2.5" fill="#1e1b4b"/>
    </g>

    <text x="95" y="40" font-family="'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#facc15" text-anchor="middle">+</text>

    <!-- Watermelon 2 -->
    <g transform="translate(120, 5)">
      <path d="M 0 35 A 35 35 0 0 0 70 35 Z" fill="#166534" stroke="#14532d" stroke-width="3"/>
      <path d="M 4 33 A 31 31 0 0 0 66 33 Z" fill="#bbf7d0"/>
      <path d="M 8 31 A 27 27 0 0 0 62 31 Z" fill="url(#wm-pulp)"/>
      <circle cx="25" cy="20" r="2.5" fill="#1e1b4b"/>
      <circle cx="35" cy="25" r="2.5" fill="#1e1b4b"/>
      <circle cx="45" cy="20" r="2.5" fill="#1e1b4b"/>
    </g>

    <text x="215" y="40" font-family="'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#38bdf8" text-anchor="middle">=</text>
    <text x="275" y="42" font-family="'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#fff" text-anchor="middle">40</text>
  </g>

  <!-- Line 2: 🍉 + 🍏 = 50 -->
  <g transform="translate(60, 150)" filter="url(#fm-shad)">
    <!-- Watermelon -->
    <g transform="translate(0, 5)">
      <path d="M 0 35 A 35 35 0 0 0 70 35 Z" fill="#166534" stroke="#14532d" stroke-width="3"/>
      <path d="M 4 33 A 31 31 0 0 0 66 33 Z" fill="#bbf7d0"/>
      <path d="M 8 31 A 27 27 0 0 0 62 31 Z" fill="url(#wm-pulp)"/>
      <circle cx="25" cy="20" r="2.5" fill="#1e1b4b"/>
      <circle cx="35" cy="25" r="2.5" fill="#1e1b4b"/>
      <circle cx="45" cy="20" r="2.5" fill="#1e1b4b"/>
    </g>

    <text x="95" y="40" font-family="'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#facc15" text-anchor="middle">+</text>

    <!-- Green Apple -->
    <g transform="translate(125, 0)">
      <circle cx="30" cy="30" r="24" fill="url(#apple-grad)"/>
      <!-- Apple indent -->
      <path d="M26 12 Q30 16 34 12" stroke="#15803d" stroke-width="2" fill="none"/>
      <!-- Stem & Leaf -->
      <path d="M30 12 Q32 4 37 2" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="40" cy="6" rx="7" ry="4" fill="#86efac" transform="rotate(-30 40 6)"/>
      <circle cx="22" cy="22" r="6" fill="#fff" opacity="0.4"/>
    </g>

    <text x="215" y="40" font-family="'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#38bdf8" text-anchor="middle">=</text>
    <text x="275" y="42" font-family="'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#fff" text-anchor="middle">50</text>
  </g>

  <!-- Line 3: 🍉 + 🍊 + 🍏 = 90 -->
  <g transform="translate(50, 240)" filter="url(#fm-shad)">
    <!-- Watermelon mini -->
    <g transform="translate(0, 8)">
      <path d="M 0 28 A 28 28 0 0 0 56 28 Z" fill="#166534"/>
      <path d="M 4 25 A 24 24 0 0 0 52 25 Z" fill="#ef4444"/>
      <circle cx="20" cy="18" r="2" fill="#000"/>
      <circle cx="36" cy="18" r="2" fill="#000"/>
    </g>

    <text x="75" y="36" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#facc15" text-anchor="middle">+</text>

    <!-- Orange -->
    <g transform="translate(98, 2)">
      <circle cx="24" cy="26" r="22" fill="url(#orange-grad)"/>
      <ellipse cx="24" cy="6" rx="5" ry="3" fill="#22c55e" transform="rotate(-20 24 6)"/>
      <circle cx="18" cy="20" r="5" fill="#fff" opacity="0.4"/>
    </g>

    <text x="160" y="36" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#facc15" text-anchor="middle">+</text>

    <!-- Apple mini -->
    <g transform="translate(182, 4)">
      <circle cx="22" cy="24" r="20" fill="url(#apple-grad)"/>
      <ellipse cx="26" cy="6" rx="5" ry="3" fill="#86efac" transform="rotate(-20 26 6)"/>
    </g>

    <text x="245" y="36" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#38bdf8" text-anchor="middle">=</text>
    <text x="295" y="38" font-family="'Arial Black', sans-serif" font-size="30" font-weight="900" fill="#fff" text-anchor="middle">90</text>
  </g>

  <!-- Big Glowing Final Question Line: 🍉 + 🍏 × 🍊 = ? -->
  <g transform="translate(45, 340)" filter="url(#fm-shad)">
    <!-- Highlight Plate -->
    <rect x="0" y="0" width="410" height="90" rx="20" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="3"/>

    <!-- 🍉 -->
    <g transform="translate(20, 18)">
      <path d="M 0 30 A 30 30 0 0 0 60 30 Z" fill="#166534"/>
      <path d="M 4 27 A 26 26 0 0 0 56 27 Z" fill="#ef4444"/>
    </g>

    <text x="102" y="55" font-family="'Arial Black', sans-serif" font-size="32" font-weight="900" fill="#facc15" text-anchor="middle">+</text>

    <!-- 🍏 -->
    <g transform="translate(125, 15)">
      <circle cx="24" cy="25" r="22" fill="url(#apple-grad)"/>
    </g>

    <text x="195" y="55" font-family="'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#f43f5e" text-anchor="middle">×</text>

    <!-- 🍊 -->
    <g transform="translate(225, 15)">
      <circle cx="24" cy="25" r="22" fill="url(#orange-grad)"/>
    </g>

    <text x="295" y="55" font-family="'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#38bdf8" text-anchor="middle">=</text>

    <!-- Glowing Question Mark ? -->
    <rect x="330" y="15" width="60" height="60" rx="14" fill="#e11d48"/>
    <text x="360" y="60" font-family="'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#fff" text-anchor="middle">?</text>
  </g>
</svg>
