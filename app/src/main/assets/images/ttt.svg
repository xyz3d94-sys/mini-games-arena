<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ttt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- Green Rounded Square Icon Background (from 3.png) -->
  <rect width="500" height="500" rx="90" fill="url(#ttt-bg)"/>

  <!-- White 3x3 Grid Lines -->
  <!-- Vertical lines -->
  <line x1="170" y1="15" x2="170" y2="485" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <line x1="330" y1="15" x2="330" y2="485" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <!-- Horizontal lines -->
  <line x1="15" y1="170" x2="485" y2="170" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <line x1="15" y1="330" x2="485" y2="330" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>

  <!-- Row 1: O (col 1), O (col 2), X (col 3) -->
  <!-- Row 1 Col 1: O -->
  <circle cx="92" cy="92" r="54" fill="none" stroke="#ffffff" stroke-width="18"/>
  <!-- Row 1 Col 2: O -->
  <circle cx="250" cy="92" r="54" fill="none" stroke="#ffffff" stroke-width="18"/>
  <!-- Row 1 Col 3: X -->
  <line x1="365" y1="48" x2="450" y2="135" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  <line x1="450" y1="48" x2="365" y2="135" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>

  <!-- Row 2: X (col 1), O (col 2), O (col 3) -->
  <!-- Row 2 Col 1: X -->
  <line x1="48" y1="205" x2="135" y2="295" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  <line x1="135" y1="205" x2="48" y2="295" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  <!-- Row 2 Col 2: O -->
  <circle cx="250" cy="250" r="54" fill="none" stroke="#ffffff" stroke-width="18"/>
  <!-- Row 2 Col 3: O -->
  <circle cx="408" cy="250" r="54" fill="none" stroke="#ffffff" stroke-width="18"/>

  <!-- Row 3: X (col 1), X (col 2), O (col 3) -->
  <!-- Row 3 Col 1: X -->
  <line x1="48" y1="365" x2="135" y2="452" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  <line x1="135" y1="365" x2="48" y2="452" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  <!-- Row 3 Col 2: X -->
  <line x1="205" y1="365" x2="295" y2="452" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  <line x1="295" y1="365" x2="205" y2="452" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  <!-- Row 3 Col 3: O -->
  <circle cx="408" cy="408" r="54" fill="none" stroke="#ffffff" stroke-width="18"/>

  <!-- Diagonal Winning Slash across three O's (from 3.png) -->
  <line x1="30" y1="70" x2="470" y2="430" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
</svg>
