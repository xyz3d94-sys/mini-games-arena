<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="st-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#701a75"/>
    </linearGradient>
    <linearGradient id="brain-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="red-splash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="green-splash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="blue-splash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="yellow-splash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="st-shad" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#090514" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="44" fill="url(#st-bg)"/>

  <!-- Radial Lights -->
  <circle cx="250" cy="240" r="180" fill="#a855f7" opacity="0.2"/>
  <circle cx="250" cy="240" r="110" fill="#f43f5e" opacity="0.15"/>

  <!-- 4 Color Badges / Paint Drops orbiting the center -->
  <!-- Top Left: RED -->
  <g filter="url(#st-shad)">
    <circle cx="95" cy="115" r="48" fill="url(#red-splash)"/>
    <circle cx="85" cy="105" r="14" fill="#fff" opacity="0.5"/>
    <text x="95" y="125" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#fff" text-anchor="middle">R</text>
  </g>

  <!-- Top Right: GREEN -->
  <g filter="url(#st-shad)">
    <circle cx="405" cy="115" r="48" fill="url(#green-splash)"/>
    <circle cx="395" cy="105" r="14" fill="#fff" opacity="0.5"/>
    <text x="405" y="125" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#fff" text-anchor="middle">G</text>
  </g>

  <!-- Bottom Left: BLUE -->
  <g filter="url(#st-shad)">
    <circle cx="95" cy="385" r="48" fill="url(#blue-splash)"/>
    <circle cx="85" cy="375" r="14" fill="#fff" opacity="0.5"/>
    <text x="95" y="395" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#fff" text-anchor="middle">B</text>
  </g>

  <!-- Bottom Right: YELLOW -->
  <g filter="url(#st-shad)">
    <circle cx="405" cy="385" r="48" fill="url(#yellow-splash)"/>
    <circle cx="395" cy="375" r="14" fill="#fff" opacity="0.5"/>
    <text x="405" y="395" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#713f12" text-anchor="middle">Y</text>
  </g>

  <!-- Central Smart Cartoon Brain -->
  <g filter="url(#st-shad)">
    <!-- Brain Base Silhouette -->
    <!-- Left Hemisphere -->
    <path d="M 240 180 C 210 140, 150 140, 140 200 C 120 220, 120 280, 150 300 C 140 330, 170 360, 210 350 C 230 350, 240 330, 240 330 Z" fill="url(#brain-grad)"/>
    <!-- Right Hemisphere -->
    <path d="M 260 180 C 290 140, 350 140, 360 200 C 380 220, 380 280, 350 300 C 360 330, 330 360, 290 350 C 270 350, 260 330, 260 330 Z" fill="url(#brain-grad)"/>

    <!-- Brain Folds (Squiggles) -->
    <path d="M 160 200 Q 180 220 160 250 T 190 280 T 210 320" stroke="#be185d" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 190 180 Q 220 200 200 240 T 230 270" stroke="#be185d" stroke-width="7" stroke-linecap="round" fill="none"/>
    
    <path d="M 340 200 Q 320 220 340 250 T 310 280 T 290 320" stroke="#be185d" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 310 180 Q 280 200 300 240 T 270 270" stroke="#be185d" stroke-width="7" stroke-linecap="round" fill="none"/>

    <!-- Highlight sheen on brain -->
    <ellipse cx="180" cy="180" rx="25" ry="12" fill="#fff" opacity="0.3" transform="rotate(-20 180 180)"/>
    <ellipse cx="320" cy="180" rx="25" ry="12" fill="#fff" opacity="0.3" transform="rotate(20 320 180)"/>

    <!-- Cool Glasses (Intellectual Style) -->
    <!-- Left Lens -->
    <circle cx="195" cy="245" r="32" fill="#1e1b4b" stroke="#facc15" stroke-width="6"/>
    <!-- Left Lens Glass Glare -->
    <circle cx="185" cy="235" r="10" fill="#38bdf8" opacity="0.8"/>
    <circle cx="190" cy="245" r="4" fill="#fff"/>

    <!-- Right Lens -->
    <circle cx="305" cy="245" r="32" fill="#1e1b4b" stroke="#facc15" stroke-width="6"/>
    <!-- Right Lens Glass Glare -->
    <circle cx="295" cy="235" r="10" fill="#38bdf8" opacity="0.8"/>
    <circle cx="300" cy="245" r="4" fill="#fff"/>

    <!-- Bridge of Glasses -->
    <line x1="227" y1="245" x2="273" y2="245" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>

    <!-- Cheerful Smile -->
    <path d="M 220 295 Q 250 320 280 295" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Rosy Cheeks -->
    <circle cx="155" cy="285" r="12" fill="#fda4af" opacity="0.7"/>
    <circle cx="345" cy="285" r="12" fill="#fda4af" opacity="0.7"/>
  </g>

  <!-- Speed Lightning Sparks -->
  <polygon points="250,70 262,95 248,97 258,125 235,93 250,91" fill="#facc15" filter="url(#st-shad)"/>
  <polygon points="120,280 128,295 120,296 126,312 110,294 121,293" fill="#facc15"/>
  <polygon points="380,280 388,295 380,296 386,312 370,294 381,293" fill="#38bdf8"/>
</svg>
