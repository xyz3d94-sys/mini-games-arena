<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mine-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="mine-body" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="flag-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="tile-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="m-shad" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="44" fill="url(#mine-bg)"/>

  <!-- Subtle 9x9 Grid Motif in Background -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="2">
    <line x1="80" y1="50" x2="80" y2="450"/>
    <line x1="160" y1="50" x2="160" y2="450"/>
    <line x1="240" y1="50" x2="240" y2="450"/>
    <line x1="320" y1="50" x2="320" y2="450"/>
    <line x1="400" y1="50" x2="400" y2="450"/>
    <line x1="50" y1="120" x2="450" y2="120"/>
    <line x1="50" y1="200" x2="450" y2="200"/>
    <line x1="50" y1="280" x2="450" y2="280"/>
    <line x1="50" y1="360" x2="450" y2="360"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="230" cy="270" r="160" fill="#38bdf8" opacity="0.15"/>
  <circle cx="210" cy="250" r="100" fill="#f43f5e" opacity="0.12"/>

  <!-- 3D Revealed Tile Bases -->
  <g filter="url(#m-shad)">
    <!-- Tile 1 (Left) -->
    <rect x="60" y="310" width="100" height="100" rx="18" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <rect x="64" y="314" width="92" height="92" rx="14" fill="#0f172a"/>
    <text x="110" y="380" font-family="'Arial Black', sans-serif" font-size="58" font-weight="900" fill="#38bdf8" text-anchor="middle">1</text>

    <!-- Tile 2 (Right) -->
    <rect x="340" y="310" width="100" height="100" rx="18" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <rect x="344" y="314" width="92" height="92" rx="14" fill="#0f172a"/>
    <text x="390" y="380" font-family="'Arial Black', sans-serif" font-size="58" font-weight="900" fill="#22c55e" text-anchor="middle">2</text>
  </g>

  <!-- Central Cartoon Mine Sphere with Spikes -->
  <g filter="url(#m-shad)">
    <!-- Spikes radiating out -->
    <rect x="214" y="110" width="32" height="60" rx="10" fill="#334155"/>
    <circle cx="230" cy="116" r="16" fill="#64748b"/>

    <rect x="214" y="370" width="32" height="60" rx="10" fill="#334155"/>
    <circle cx="230" cy="424" r="16" fill="#64748b"/>

    <rect x="100" y="254" width="60" height="32" rx="10" fill="#334155"/>
    <circle cx="106" cy="270" r="16" fill="#64748b"/>

    <rect x="300" y="254" width="60" height="32" rx="10" fill="#334155"/>
    <circle cx="354" cy="270" r="16" fill="#64748b"/>

    <!-- Diagonal Spikes -->
    <g transform="rotate(45 230 270)">
      <rect x="216" y="130" width="28" height="50" rx="10" fill="#334155"/>
      <circle cx="230" cy="136" r="14" fill="#64748b"/>

      <rect x="216" y="360" width="28" height="50" rx="10" fill="#334155"/>
      <circle cx="230" cy="404" r="14" fill="#64748b"/>

      <rect x="120" y="256" width="50" height="28" rx="10" fill="#334155"/>
      <circle cx="126" cy="270" r="14" fill="#64748b"/>

      <rect x="290" y="256" width="50" height="28" rx="10" fill="#334155"/>
      <circle cx="334" cy="270" r="14" fill="#64748b"/>
    </g>

    <!-- Main Mine Ball -->
    <circle cx="230" cy="270" r="105" fill="url(#mine-body)" stroke="#475569" stroke-width="4"/>

    <!-- Highlight Reflection on Ball -->
    <ellipse cx="195" cy="225" rx="45" ry="25" fill="#ffffff" opacity="0.25" transform="rotate(-30 195 225)"/>

    <!-- Playful Center Indicator / Fuse Ring -->
    <circle cx="230" cy="270" r="32" fill="#0f172a" stroke="#ef4444" stroke-width="6"/>
    <circle cx="230" cy="270" r="16" fill="#f43f5e"/>
    <circle cx="225" cy="265" r="5" fill="#fff" opacity="0.8"/>
  </g>

  <!-- Big Red Flag 🚩 planted proudly at top right -->
  <g filter="url(#m-shad)">
    <!-- Flagpole (Golden Metal) -->
    <line x1="330" y1="70" x2="330" y2="240" stroke="#facc15" stroke-width="8" stroke-linecap="round"/>
    <circle cx="330" cy="65" r="12" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/>
    
    <!-- Flag Fabric with waving shadow -->
    <path d="M334 72 L440 120 L334 168 Z" fill="url(#flag-grad)"/>
    <!-- Flag inner shadow wave -->
    <path d="M334 110 Q380 130 440 120 L334 168 Z" fill="#991b1b" opacity="0.4"/>
  </g>

  <!-- Sparkles / Stars -->
  <path d="M80 120 Q100 120 100 100 Q100 120 120 120 Q100 120 100 140 Q100 120 80 120 Z" fill="#facc15"/>
  <path d="M420 230 Q435 230 435 215 Q435 230 450 230 Q435 230 435 245 Q435 230 420 230 Z" fill="#38bdf8"/>
</svg>
