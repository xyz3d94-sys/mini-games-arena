<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ttt5-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="500" height="500" rx="90" fill="url(#ttt5-bg)"/>

  <!-- Subtle 5x5 grid lines -->
  <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.35">
    <line x1="110" y1="30" x2="110" y2="470"/>
    <line x1="190" y1="30" x2="190" y2="470"/>
    <line x1="270" y1="30" x2="270" y2="470"/>
    <line x1="350" y1="30" x2="350" y2="470"/>
    <line x1="430" y1="30" x2="430" y2="470"/>

    <line x1="30" y1="110" x2="470" y2="110"/>
    <line x1="30" y1="190" x2="470" y2="190"/>
    <line x1="30" y1="270" x2="470" y2="270"/>
    <line x1="30" y1="350" x2="470" y2="350"/>
    <line x1="30" y1="430" x2="470" y2="430"/>
  </g>

  <!-- Main 4-in-a-row Winning Diagonal Highlight Line -->
  <line x1="130" y1="130" x2="370" y2="370" stroke="#facc15" stroke-width="14" stroke-linecap="round" opacity="0.8" filter="url(#shadow)"/>

  <!-- X symbols (Red-Orange vibrant) -->
  <g stroke="#f43f5e" stroke-width="20" stroke-linecap="round" filter="url(#shadow)">
    <!-- X 1 -->
    <line x1="125" y1="125" x2="175" y2="175"/>
    <line x1="175" y1="125" x2="125" y2="175"/>
    <!-- X 2 -->
    <line x1="205" y1="205" x2="255" y2="255"/>
    <line x1="255" y1="205" x2="205" y2="255"/>
    <!-- X 3 -->
    <line x1="285" y1="285" x2="335" y2="335"/>
    <line x1="335" y1="285" x2="285" y2="335"/>
    <!-- X 4 (Winning 4th) -->
    <line x1="365" y1="365" x2="415" y2="415"/>
    <line x1="415" y1="365" x2="365" y2="415"/>

    <!-- Extra decorative X -->
    <line x1="290" y1="125" x2="330" y2="165"/>
    <line x1="330" y1="125" x2="290" y2="165"/>
  </g>

  <!-- O symbols (Cyan Vibrant) -->
  <g fill="none" stroke="#38bdf8" stroke-width="18" filter="url(#shadow)">
    <circle cx="70" cy="150" r="28"/>
    <circle cx="150" cy="310" r="28"/>
    <circle cx="230" cy="390" r="28"/>
    <circle cx="390" cy="230" r="28"/>
  </g>

  <!-- Top 5x5 Pill Badge -->
  <g filter="url(#shadow)">
    <rect x="150" y="28" width="200" height="66" rx="33" fill="url(#badge-glow)"/>
    <text x="250" y="72" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="2">5 × 5</text>
  </g>
</svg>
